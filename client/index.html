<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VYRON — Gaming Intelligence</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">

            <div class="brand">
                <div class="brand-mark">V</div>

                <div>
                    <h1>VYRON</h1>
                    <span>GAMING INTELLIGENCE</span>
                </div>
            </div>

            <div class="status">

                <button id="newChatButton" class="new-chat-button">
                    ＋ NEW CHAT
                </button>

                <span class="status-dot"></span>
                ONLINE
            </div>

        </header>


        <!-- MAIN -->
        <main class="main">

            <section class="welcome">

                <div class="welcome-tag">
                    <span>◈</span>
                    GAMING AI SYSTEM
                </div>

                <h2>
                    ENTER THE<br>
                    <span>GAMING UNIVERSE.</span>
                </h2>

                <p>
                    Ask VYRON anything about games,
                    from PC and console to mobile and esports.
                </p>

            </section>


            <!-- CHAT -->
            <section class="chat-container">

                <div id="chatMessages" class="chat-messages">

                    <div class="message ai">
                        <div class="avatar">V</div>

                        <div class="bubble">
                            <div class="message-name">VYRON</div>

                            <p>
                                System online. 🎮<br>
                                What game are we talking about?
                            </p>
                        </div>
                    </div>

                </div>


                <!-- INPUT -->
                <form id="chatForm" class="chat-input">

                    <!-- <input type="text" id="messageInput" placeholder="Ask anything about gaming..." autocomplete="off"> -->
                    <textarea id="messageInput" placeholder="Ask anything about gaming..." autocomplete="off"
                        rows="1"></textarea>

                    <button type="submit">
                        <span>➤</span>
                    </button>

                </form>

            </section>

        </main>


        <!-- FOOTER -->
        <footer class="footer">

            <span>PC</span>
            <span>MOBILE</span>
            <span>CONSOLE</span>
            <span>ESPORTS</span>
            <span>INDIE</span>
            <span>GAME LORE</span>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
